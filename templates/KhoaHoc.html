<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Danh mục khóa học</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#74ebd5 0%,#ACB6E5 100%);margin:0;padding:0;}
.container{width:750px;margin:40px auto;background:#fff;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,0.3);padding:30px;}
h2{text-align:center;color:#2575fc;margin-bottom:20px;}
form{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-bottom:20px;}
label{text-align:right;padding-right:10px;font-weight:bold;color:#333;}
input{padding:8px;border:1px solid #ccc;border-radius:8px;width:100%;}
.btn-small{grid-column:span 2;padding:8px 20px;border:none;border-radius:8px;background:linear-gradient(145deg,#6a11cb,#2575fc);color:#fff;cursor:pointer;width:auto;display:block;margin:0 auto;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
table th,table td{border:1px solid #ccc;padding:10px;text-align:center;}
table th{background:#2575fc;color:#fff;}
.actions{text-align:center;margin-top:20px;}
.actions button,.actions a button{margin:5px;padding:8px 20px;border:none;border-radius:8px;background:#2575fc;color:#fff;cursor:pointer;}
</style>
</head>
<body>
<div class="container">
<h2>DANH MỤC KHÓA HỌC</h2>
<form method="post" action="/them_khoa">
<label>Mã khóa:</label>
<input type="text" name="makh" required>
<label>Tên khóa:</label>
<input type="text" name="tenkh" required>
<label>Năm bắt đầu:</label>
<input type="number" name="nambatdau" required>
<label>Năm kết thúc:</label>
<input type="number" name="namketthuc" required>
<button type="submit" class="btn-small">Thêm mới</button>
</form>
<table>
<tr><th>Mã khóa</th><th>Tên khóa</th><th>Năm bắt đầu</th><th>Năm kết thúc</th><th>Thao tác</th></tr>
{% for k in danhsach %}
<tr>
<td>{{ k.MAKH }}</td>
<td>{{ k.TENKH }}</td>
<td>{{ k.NAMBATDAU }}</td>
<td>{{ k.NAMKETTHUC }}</td>
<td>
<a href="{{ url_for('sua_khoa', makh=k.MAKH) }}"><button>Sửa</button></a>
<a href="{{ url_for('xoa_khoa', makh=k.MAKH) }}" onclick="return confirm('Xóa khóa học này?')"><button>Xóa</button></a>
</td>
</tr>
{% endfor %}
</table>
<div class="actions">
<a href="/quanly"><button>Quay lại Trang chính</button></a>
</div>
</div>
</body>
</html>
