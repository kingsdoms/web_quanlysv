<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Sửa môn học</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 100%);margin:0;padding:0;}
.container{width:500px;margin:50px auto;background:#fff;border-radius:12px;box-shadow:0 6px 15px rgba(0,0,0,0.3);padding:25px;}
h2{text-align:center;color:#2575fc;margin-bottom:20px;}
form{display:grid;grid-template-columns:150px 1fr;gap:12px;}
label{text-align:right;font-weight:bold;color:#333;}
input{padding:8px;border:1px solid #ccc;border-radius:8px;width:100%;}
.btn-update{grid-column:span 2;padding:10px 30px;background:#4caf50;color:#fff;border:none;border-radius:8px;cursor:pointer;display:block;margin:0 auto;}
.back-link{grid-column:span 2;text-align:center;margin-top:15px;}
.back-link a{color:#6a11cb;text-decoration:none;font-weight:bold;}
</style>
</head>
<body>
<div class="container">
<h2>SỬA MÔN HỌC</h2>
<form method="POST">
<label>Mã môn:</label>
<input type="text" value="{{ mon.MAMH }}" readonly>
<label>Tên môn:</label>
<input type="text" name="tenmh" value="{{ mon.TENMH }}">
<label>Số tín chỉ:</label>
<input type="number" name="sotinchi" value="{{ mon.SOTINCHI }}">
<button type="submit" class="btn-update">Cập nhật</button>
<div class="back-link"><a href="{{ url_for('monhoc') }}">Quay lại danh sách</a></div>
</form>
</div>
</body>
</html>
