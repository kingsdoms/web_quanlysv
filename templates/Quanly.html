<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phần mềm QLSV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            margin: 0;
            padding: 0;
        }
        .container {
            display: flex;
            width: 1000px;
            margin: 50px auto;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .sidebar {
            flex: 2;
            background: #f0f8ff;
            padding: 20px;
            text-align: center;
        }
        .logo {
            width: 120px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo-text {
            font-weight: bold;
            color: #003366;
            font-size: 20px;
            margin-right: 15px;
        }
        .sidebar button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(145deg, #6a11cb, #2575fc);
            color: white;
            cursor: pointer;
            box-shadow: 4px 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .sidebar button:hover {
            transform: translateY(-3px);
            box-shadow: 6px 6px 12px rgba(0,0,0,0.3);
        }
        .main {
            flex: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }
        .main h1 {
            font-size: 48px;
            color: #003366;
            text-shadow: 2px 2px 4px #aaa;
        }
        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar với logo và menu -->
        <div class="sidebar">
            <div class="logo-row">
                <img src="{{ url_for('static', filename='logo_HUBT.png') }}" alt="Logo Trường" class="logo">
            </div>
            <a href="/khoahoc"><button>DANH MỤC KHÓA HỌC</button></a>
            <a href="/lophoc"><button>DANH MỤC LỚP HỌC</button></a>
            <a href="/nganhhoc"><button>DANH MỤC NGÀNH HỌC</button></a>
            <a href="/monhoc"><button>DANH MỤC MÔN HỌC</button></a>
            <a href="/hososv"><button>HỒ SƠ SINH VIÊN</button></a>
            <a href="/ketqua"><button>KẾT QUẢ HỌC TẬP</button></a>
            <a href="/thoat"><button>THOÁT CHƯƠNG TRÌNH</button></a>
        </div>

        <!-- Main content -->
        <div class="main">
            <h1>PHẦN MỀM QUẢN LÝ SINH VIÊN</h1>
        </div>
    </div>
</body>
</html>
